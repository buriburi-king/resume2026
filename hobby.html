<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나민우 포트폴리오✨</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 헤더(페이지 공통) -->
    <header>
      <div class="header__container">
        <nav class="header__nav">
          <ul class="header__menu-list">
            <!-- 메뉴 -->
            <li class="header__menu-item">
              <a href="index.html" class="header__menu-link">이력서</a>
            </li>
            <li class="header__menu-item">
              <a href="intro.html" class="header__menu-link">자기소개</a>
            </li>
            <li class="header__menu-item">
              <a href="projects.html" class="header__menu-link">프로젝트</a>
            </li>
            <li class="header__menu-item">
              <a
                href="hobby.html"
                class="header__menu-link header__menu-link--active"
                >Hobby</a
              >
            </li>
            <!-- 메뉴 끝-->
          </ul>
        </nav>
      </div>
    </header>
    <!-- 메인 -->
    <main class="hobby">
      <div class="hobby__container">
        <h1 class="hobby__main-title">Hobby</h1>
        <!-- 미디어 -->
        <ul class="hobby__media-list">
          <li class="hobby__media-item">
            <p class="hobby__media-text">월출산</p>
            <video class="hobby__video" controls muted loop>
              <source src="images/2배속.mp4" type="video/mp4" />
            </video>
          </li>
          <li class="hobby__media-item">
            <p class="hobby__media-text">사직 공원</p>
            <img
              src="images/사진2.jpg"
              alt="광주 사직공원을 한 눈에 내려보는 사진"
              class="hobby__image"
            />
          </li>
          <li class="hobby__media-item">
            <video class="hobby__video" controls muted loop>
              <source src="images/영상1.mp4" type="video/mp4" />
            </video>
          </li>
          <li class="hobby__media-item">
            <p class="hobby__media-text">여수 용월사</p>
            <img
              src="images/사진1.JPG"
              alt="여수 용월사를 한 눈에 내려보는 사진"
              class="hobby__image"
            />
          </li>
          <li class="hobby__media-item">
            <video class="hobby__video" controls muted loop>
              <source src="images/video2.mp4" type="video/mp4" />
            </video>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
