<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나민우 포트폴리오✨</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 헤더(페이지 공통) -->
    <header>
      <div class="header__container">
        <nav class="header__nav">
          <ul class="header__menu-list">
            <!-- 메뉴 -->
            <li class="header__menu-item">
              <a href="index.html" class="header__menu-link">이력서</a>
            </li>
            <li class="header__menu-item">
              <a href="intro.html" class="header__menu-link">자기소개</a>
            </li>
            <li class="header__menu-item">
              <a
                href="projects.html"
                class="header__menu-link header__menu-link--active"
                >프로젝트</a
              >
            </li>
            <li class="header__menu-item">
              <a href="hobby.html" class="header__menu-link">Hobby</a>
            </li>
            <!-- 메뉴 끝-->
          </ul>
        </nav>
      </div>
    </header>
    <!-- 메인 -->
    <main class="projects">
      <div class="projects__container">
        <h1 class="projects__main-title">PROJECTS</h1>
        <!-- 섹션 및 그리드 -->
        <section class="project-item">
          <div class="project-item__info-wrap">
            <!-- 왼쪽 글귀 -->
            <div class="project-item__text-side">
              <h2 class="project-item__title">밀키트 상점 레이아웃 구현</h2>
              <ul class="project-item__content-list">
                <li class="project-item__content-text">
                  - 부트캠프 수업을 통해 HTML과 CSS로만 핵심 구조 및 정렬 방식을
                  통해 완성함
                </li>
                <li class="project-item__content-text">
                  - 가이드라인을 바탕으로 CodePen 환경에서 실습하며 마크업을
                  직접 작성함
                </li>
                <li class="project-item__content-text">
                  - 완성한 달콤상점을 리뉴얼해서 밀키트상점으로 탈바꿈
                </li>
              </ul>
            </div>
            <!-- 오른쪽 배너 -->
            <div class="project-item__badge-side">
              <img
                src="images/logo.png"
                alt="밀키트 상점 로고"
                class="project-item__badge-img"
              />
            </div>
          </div>
          <!-- 웹 페이지 -->
          <div class="project-item__img-wrap">
            <ul class="project-item__img-list">
              <li class="project-item__img-item">
                <img
                  src="images/1.png"
                  alt="밀키트 상점 배너"
                  class="project-item__img"
                />
              </li>
              <li class="project-item__img-item">
                <img
                  src="images/2.png"
                  alt="밀키트 상점 리스트"
                  class="project-item__img"
                />
              </li>
              <li class="project-item__img-item">
                <img
                  src="images/3.png"
                  alt="밀키트 상점 가격표"
                  class="project-item__img"
                />
              </li>
              <li class="project-item__img-item">
                <img
                  src="images/4.png"
                  alt="밀키트 상점 주문문의"
                  class="project-item__img"
                />
              </li>
            </ul>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
